# kind: SecretProviderClass
# metadata:
#   name: kv-mfolabs # needs to be unique per namespace
# spec:
#   parameters:
#     userAssignedIdentityID: 2977be69-0d95-418c-935b-69c3085616c4 # Setting this to use workload identity ClientID
#     keyvaultName: kv-aptar-aks-form # Set to the name of your key vault
#     tenantId: 1e2f522c-2662-4a18-938a-8b61a1ab92d1 # The tenant ID of the key vault


apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-manager
  annotations:
    "helm.sh/hook": pre-install
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "RabbitMQUsername"  
        objectType: "secretsmanager"
        objectAlias: "rabbitmq-username"
      - objectName: "RabbitMQPassword"
        objectType: "secretsmanager"
        objectAlias: "rabbitmq-password"
      - objectName: "MSSQL-SA-PASSWORD"
        objectType: "secretsmanager"
        objectAlias: "mssql-password"
  secretObjects:
    - secretName: mssql-password
      type: Opaque
      data:
        - objectName: "mssql-password"
          key: mssql-password
    - secretName: rabbit-password
      type: Opaque
      data:
        - objectName: "rabbitmq-password"
          key: rabbit-password
    - secretName: rabbit-username
      type: Opaque
      data:
        - objectName: "rabbitmq-username"
          key: rabbit-username
